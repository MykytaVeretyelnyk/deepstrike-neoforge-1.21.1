plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.0'
group = 'dev.warmode'
base { archivesName = 'warmode' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'
    mods {
        warmode { sourceSet sourceSets.main }
    }
    runs {
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }
}

dependencies {
    runtimeOnly files('../libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar')
    runtimeOnly files('../libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    runtimeOnly files('../libs/kotlinforforge-5.12.0-all.jar')
    runtimeOnly files('../source/build/libs/dsm-0.9.0-neoforge-1.21.1.jar')
    // Soft dependencies: only referenced from classes that are loaded when the mod is present.
    compileOnly files('../libs/superbwarfare-0.8.9.2-mc1.21.1-c22d98c2.jar')
    compileOnly files('../libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    compileOnly files('../libs/kotlinforforge-5.12.0-all.jar')
    compileOnly files('../source/build/libs/dsm-0.9.0-neoforge-1.21.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
