plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.5.0'
group = 'dev.colonyjournal'
base { archivesName = 'colonyjournal' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'
    addModdingDependenciesTo(sourceSets.test)
    mods {
        colonyjournal { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.colonyjournal
    }
    runs {
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }
}

dependencies {
    def libs = ['minecolonies-1.1.1403-1.21.1', 'structurize-1.0.832-1.21.1', 'blockui-1.0.209-1.21.1',
                'domum-ornamentum-1.0.231-main', 'framework-neoforge-1.21.1-0.13.11', 'curios-neoforge-9.5.1+1.21.1']
    libs.each {
        compileOnly files("../libs/${it}.jar")
        runtimeOnly files("../libs/${it}.jar")
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
